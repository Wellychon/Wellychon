name: profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: gera o svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/snake.svg?palette=github-dark&color_snake=#E5FF00&color_dots=#0A0A0A,#0000FF,#3333FF,#8080FF,#E5FF00

      - name: publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assets:
    # Redesenha header/typing/stack/stats/footer com os numeros do dia.
    # O commit sai com o GITHUB_TOKEN, que por design nao dispara workflow de novo —
    # entao o push na main aqui nao vira loop.
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install --quiet fonttools uharfbuzz

      - name: gera os svgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_assets.py

      - name: commita se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "assets: rebuild [skip ci]"
            git push
          fi
